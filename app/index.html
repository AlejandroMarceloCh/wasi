<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Wasi — Proptech con IA · Lima</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" crossorigin="" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" crossorigin="" />
<link rel="stylesheet" href="styles.css">
</head>
<body>
<script>
  /* Anti-flash: aplica el tema guardado ANTES del primer render. */
  (function(){
    try{
      var t = localStorage.getItem('wasi.theme');
      if(t === 'dark') document.documentElement.setAttribute('data-theme','dark');
    }catch(e){}
    /* Override de backend SOLO para demo local: entra con #api8001 para apuntar
       el frontend a un backend Wasi corriendo en :8001 (cuando :8000 está ocupado
       por otro proyecto). Inerte sin el hash → no afecta el setup normal ni prod. */
    try{
      if((location.hash||'').indexOf('api8001') >= 0) window.WASI_API_BASE = 'http://localhost:8001';
    }catch(e){}
  })();
</script>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js" crossorigin=""></script>
<script src="https://unpkg.com/d3@7/dist/d3.min.js" crossorigin=""></script>

<script>
  /* Cache-busting — setup sin build: cada carga trae los archivos frescos.
     Evita que el navegador sirva .js/.jsx cacheados tras un cambio. */
  (function () {
    var v = Date.now();
    document.write('<script src="api.js?v=' + v + '"><\/script>');
    document.write('<script src="aliases_lima.js?v=' + v + '"><\/script>');
    document.write('<script src="stats.js?v=' + v + '"><\/script>');
    /* Pantallas por dominio. El orden importa: core declara los
       helpers/aliases compartidos; app monta al final. */
    ['components', 'screens-core', 'screens-public', 'screens-home',
     'screens-fairvalue', 'screens-profile', 'screens-listings',
     'screens-seller', 'app'].forEach(function (f) {
      document.write('<script type="text/babel" src="' + f + '.jsx?v=' + v + '"><\/script>');
    });
  })();
</script>
</body>
</html>
