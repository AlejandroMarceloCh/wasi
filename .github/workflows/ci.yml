name: CI

on:
  push:
    branches: [main, refactor/modular]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
          cache-dependency-path: app/backend/requirements.txt

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run tests
        env:
          DATABASE_URL: sqlite:///./wasi_ci.db
          JWT_SECRET: ci-secret-not-real-min-32-chars-padding-xyz
          GROQ_API_KEY: ""
          WASI_SKIP_BULK_SEED: "1"
        run: python -m pytest -q --tb=short
