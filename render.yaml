# Blueprint de Render para el backend de Wasi (FastAPI + modelo).
# El frontend va por separado en Vercel (ver vercel.json).
#
# JWT_SECRET y GROQ_API_KEY se cargan como variables de entorno en el
# dashboard de Render (sync:false → NO viven en el repo). El backend las lee
# vía pydantic Settings; sin GROQ_API_KEY la app funciona igual, solo se
# desactiva la narrativa LLM.
services:
  - type: web
    name: wasi-backend
    runtime: python
    rootDir: app/backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: JWT_SECRET
        sync: false
      - key: GROQ_API_KEY
        sync: false
